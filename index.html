<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="自动同步公开上游发布源的最新软件下载地址。" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#ffffff" />
    <title>影视 APP 下载</title>
    <link rel="preconnect" href="https://raw.githubusercontent.com" />
    <link rel="stylesheet" href="assets/styles.css" />
    <script defer src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
    <script defer src="assets/app.js"></script>
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="./" aria-label="影视 APP 下载首页">
          <span class="brand-mark">TV</span>
          <span>影视 APP 下载</span>
        </a>
        <a class="source-link" href="https://github.com/FongMi/TV" target="_blank" rel="noreferrer">
          <i data-lucide="github" aria-hidden="true"></i>
          <span>上游项目</span>
        </a>
      </div>
    </header>

    <main>
      <section class="intro" aria-labelledby="page-title">
        <div class="eyebrow"><span class="live-dot"></span> 自动同步公开发布源</div>
        <h1 id="page-title">下载最新版影视应用</h1>
        <p>版本信息与安装包每 6 小时自动检查。请选择与你设备匹配的平台和架构。</p>
        <div class="sync-meta" id="sync-meta" aria-live="polite">正在读取最新数据…</div>
      </section>

      <section class="interface-section" id="interface-section" aria-labelledby="interface-title" hidden>
        <div class="interface-heading">
          <div>
            <p class="section-kicker">配置接口</p>
            <h2 id="interface-title">影视接口</h2>
          </div>
          <p>复制地址后，在播放器的点播配置中使用。</p>
        </div>
        <div class="interface-list" id="interface-list"></div>
      </section>

      <section class="catalog" aria-labelledby="catalog-title">
        <div class="catalog-heading">
          <div>
            <p class="section-kicker">正式版</p>
            <h2 id="catalog-title">可用下载</h2>
          </div>
          <div class="result-count" id="result-count" aria-live="polite"></div>
        </div>

        <div class="toolbar" aria-label="软件下载筛选">
          <label class="search-field">
            <i data-lucide="search" aria-hidden="true"></i>
            <span class="sr-only">搜索软件或版本</span>
            <input id="search-input" type="search" placeholder="搜索软件或版本" autocomplete="off" />
          </label>
          <div class="segments" role="group" aria-label="平台筛选">
            <button class="segment is-active" type="button" data-platform="all" aria-pressed="true">全部</button>
            <button class="segment" type="button" data-platform="mobile" aria-pressed="false">手机</button>
            <button class="segment" type="button" data-platform="tv" aria-pressed="false">电视</button>
          </div>
        </div>

        <div id="catalog-list" class="catalog-list" aria-live="polite" aria-busy="true">
          <div class="loading-row"><span></span><span></span><span></span></div>
        </div>
      </section>

      <section class="notice" aria-labelledby="notice-title">
        <div class="notice-icon"><i data-lucide="shield-check" aria-hidden="true"></i></div>
        <div>
          <h2 id="notice-title">下载提示</h2>
          <p>安装包来自项目公开 GitHub 仓库。红色按钮为原始地址，CDN 按钮为第三方加速；加速异常时请使用原始下载。</p>
        </div>
      </section>
    </main>

    <footer>
      <p>数据来自公开上游仓库 · 自动更新页面</p>
    </footer>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
